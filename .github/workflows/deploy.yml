name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The repo's Pages source is still "deploy from a branch", so every push
  # also triggers a legacy build of the raw source that races this workflow.
  # Until the Pages source is switched to "GitHub Actions" in the repo
  # settings, deploy a second time after the legacy build has finished so
  # the built site is always the newest (winning) deployment.
  redeploy-after-legacy:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url }}
    steps:
      - name: Wait out the legacy branch deploy
        run: sleep 150
      - id: deployment2
        uses: actions/deploy-pages@v4
